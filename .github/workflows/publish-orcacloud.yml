name: Publish to OrcaCloud

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

env:
  # OrcaCloud wants a target suffix in the file name: name_win_x86_64.py
  PLUGIN_FILE: "flashforge_device_tab.py"
  PLUGIN_TARGET: "flashforge_device_tab_win_x86_64.py"
  DESCRIPTION_FILE: "docs/orca-cloud.md"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          python3 tools/build_release.py "$PLUGIN_FILE" "$PLUGIN_TARGET"
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            --rawfile description "$DESCRIPTION_FILE" --arg description_path "$DESCRIPTION_FILE" \
            '{version: $version, description: $description, description_path: $description_path}
              + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            -F "metadata=$metadata" \
            -F "files=@$PLUGIN_TARGET" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          if [ "$status" != "201" ]; then
            echo "Orca Cloud publish failed with HTTP $status" >&2
            exit 1
          fi
          jq -c --arg status "$status" '{status: $status, version, level: .security.level}' response.json
